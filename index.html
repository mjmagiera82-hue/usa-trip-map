ta"], ["Nowy Jork → Niagara", "Przejazd i Niagara"], ["Niagara → Chicago", "Wodospady rano, przejazd do Chicago"], ["Chicago → Yellowstone", "Chicago rano + lot na Zachód"], ["Yellowstone — gejzery", "Old Faithful + Grand Prismatic"], ["Yellowstone → Grand Teton", "Kanion + Lamar / przejazd do Teton"], ["Grand Teton → Salt Lake City", "Jenny Lake + przejazd"], ["Salt Lake City → Moab", "Bonneville + dojazd do Moab"], ["Arches", "Cały dzień na Arches"], ["Canyonlands + Moab", "Island in the Sky + Dead Horse Point"], ["Capitol Reef → Bryce", "Goblin Valley + Capitol Reef + Bryce"], ["Bryce → Zion", "Bryce rano + Zion"], ["Zion → Page", "Zion rano + dojazd do Page"], ["Page → Monument Valley", "Antelope + Horseshoe + Monument Valley"], ["Grand Canyon", "South Rim + zachód słońca"], ["Grand Canyon → Las Vegas", "Route 66 + Hoover Dam"], ["Las Vegas", "Strip + Sphere"], ["Las Vegas → Death Valley", "Death Valley — dzień pustynny"], ["Death Valley → Mammoth", "Przejazd przez Sierra; Tioga zależnie od sezonu"], ["Yosemite", "Cały dzień Yosemite"], ["Sequoia / Kings Canyon", "Gigantyczne drzewa"], ["Dylemat: SF czy Joshua Tree", "SF to duży objazd; Joshua Tree lepiej pasuje do trasy"], ["Los Angeles", "Santa Monica + Hollywood"], ["Los Angeles", "Griffith + zapas na opóźnienia / lot"]], "route": [0, 4, 6, 9, 14, 17, 19, 20, 22, 25, 27, 28, 30, 34, 36, 39, 40, 43, 45, 47, 50, 55]}; const P=DATA.points,D=DATA.days,R=DATA.route; let map=L.map('map').setView([39.5,-98.35],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);let markers=[],selected=new Set(),currentFilter='all';
function icon(t){let c=t==='park'?'#2e8b57':t==='city'?'#2b6cb0':'#d97706';return L.divIcon({className:'',html:`<div style="background:${c};width:18px;height:18px;border-radius:50%;border:2px solid white;box-shadow:0 1px 5px #555"></div>`,iconSize:[22,22],iconAnchor:[11,11]})}
function popup(i){let p=P[i];return `<div class="popup"><h3>${p[0]}</h3><img src="${p[6]}"><p>${p[5]}</p><p><b>Dzień ${p[4]}</b></p><a href="${p[6]}" target="_blank">Otwórz większe zdjęcie ↗</a><br><label><input type="checkbox" ${selected.has(i)?'checked':''} onchange="toggle(${i},this.checked)"> ⭐ Mam na liście</label></div>`}
P.forEach((p,i)=>{let m=L.marker([p[1],p[2]],{icon:icon(p[3])}).addTo(map);m.bindPopup(popup(i),{maxWidth:290});markers.push(m)});
for(let k=0;k<R.length-1;k++){let a=P[R[k]],b=P[R[k+1]];let flight=(a[0]==='Chicago');L.polyline([[a[1],a[2]],[b[1],b[2]]],{weight:3,opacity:.7,dashArray:flight?'10 10':null}).addTo(map)}
function toggle(i,v){v?selected.add(i):selected.delete(i);document.getElementById('count').textContent=selected.size;renderSaved()}function renderSaved(){document.getElementById('saved').innerHTML=[...selected].map(i=>`<div class="listitem"><b>${P[i][0]}</b><br>Dzień ${P[i][4]}<br><img src="${P[i][6]}"></div>`).join('')}
function setFilter(t){currentFilter=t;P.forEach((p,i)=>markers[i].setOpacity(t==='all'||p[3]===t?1:0.12))}function fitAll(){map.fitBounds(P.map(p=>[p[1],p[2]]),{padding:[30,30]})}function fitWest(){map.fitBounds(P.filter(p=>p[2]<-100).map(p=>[p[1],p[2]]),{padding:[30,30]})}
D.forEach((d,i)=>{let o=document.createElement('option');o.value=i+1;o.textContent=`Dzień ${i+1} — ${d[0]}`;document.getElementById('daySelect').appendChild(o)});
function showDay(d){d=+d;if(!d){document.getElementById('dayInfo').innerHTML='';return}let ids=P.map((p,i)=>p[4]===d?i:null).filter(x=>x!==null);if(ids.length)map.fitBounds(ids.map(i=>[P[i][1],P[i][2]]),{padding:[70,70]});document.getElementById('dayInfo').innerHTML=`<div class="day"><b>Dzień ${d}: ${D[d-1][0]}</b>${D[d-1][1]}</div>`}
fitAll();
