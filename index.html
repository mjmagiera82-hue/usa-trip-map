</style>
</head>

let markers=[], selected=new Set(), currentFilter='all', routeLayers=[];
const pointById=Object.fromEntries(P.map(p=>[p.id,p]));
function icon(t){
 let c=t==='park'?'#2e8b57':t==='city'?'#2b6cb0':'#d97706';
 return L.divIcon({className:'',html:`<div style="background:${c};width:18px;height:18px;border-radius:50%;border:2px solid white;box-shadow:0 1px 5px #555"></div>`,iconSize:[22,22],iconAnchor:[11,11]});
}
function popup(i){
 const p=P[i];
 return `<div class="popup"><h3>${esc(p.name)}</h3>
 <div class="status">Dzień ${p.day}</div>
 <img id="img-${i}" src="" alt="Ładowanie zdjęcia…">
 <p>${esc(p.desc)}</p>
 <button onclick="toggle(${i},true)">⭐ Mam na liście</button>
 <a id="big-${i}" href="#" target="_blank" style="display:none">Otwórz większe zdjęcie ↗</a>
 <div class="status">Zdjęcie wyszukiwane automatycznie z Wikimedia Commons.</div></div>`;
}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
P.forEach((p,i)=>{
 let m=L.marker([p.lat,p.lon],{icon:icon(p.type)}).addTo(map);
 m.bindPopup(popup(i),{maxWidth:300});
 m.on('popupopen',()=>loadImage(i));
 markers.push(m);
});
function loadImage(i){
 const p=P[i], img=document.getElementById('img-'+i), big=document.getElementById('big-'+i);
 if(!img || img.dataset.loaded) return;
 const q=encodeURIComponent(p.name+' USA');
 const url='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+q+
   '&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=700&format=json&origin=*';
 fetch(url).then(r=>r.json()).then(j=>{
   const pages=j.query&&j.query.pages?Object.values(j.query.pages):[];
   if(pages.length && pages[0].imageinfo && pages[0].imageinfo[0]){
     const info=pages[0].imageinfo[0], u=info.thumburl||info.url;
     img.src=u; img.dataset.loaded='1'; big.href=info.url; big.style.display='inline-block';
   } else { img.alt='Brak zdjęcia w Wikimedia Commons'; }
 }).catch(()=>{img.alt='Nie udało się załadować zdjęcia';});
}
function setFilter(t){currentFilter=t;P.forEach((p,i)=>markers[i].setOpacity(t==='all'||p.type===t?1:0.12));}

function fitWest(){map.fitBounds(P.filter(p=>p.lon<-100).map(p=>[p.lat,p.lon]),{padding:[30,30]});}
function toggle(i,v){if(v)selected.add(i);else selected.delete(i);document.getElementById('count').textContent=selected.size;renderSaved();}
function renderSaved(){document.getElementById('saved').innerHTML=[...selected].map(i=>`<div class="listitem"><b>${esc(P[i].name)}</b><br>Dzień ${P[i].day}</div>`).join('');}

function showDay(d){
 d=+d;if(!d){document.getElementById('dayInfo').innerHTML='';return;}
 const ids=P.map((p,i)=>p.day===d?i:null).filter(x=>x!==null);
 if(ids.length) map.fitBounds(ids.map(i=>[P[i].lat,P[i].lon]),{padding:[70,70]});
 document.getElementById('dayInfo').innerHTML=`<div class="day"><b>Dzień ${d}: ${esc(D[d-1].title)}</b>${esc(D[d-1].desc)}</div>`;
 document.getElementById('metrics').innerHTML='<b>🚗 Dzień '+d+'</b><br><span class="status">Obliczam przejazdy drogowe…</span>';
 loadDayMetrics(d);
}
async function routeMetric(a,b){
 const url=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
 const r=await fetch(url); const j=await r.json();
 if(j.routes&&j.routes[0]) return {km:j.routes[0].distance/1000,min:j.routes[0].duration/60};
 return null;
}
function fmtMin(m){let h=Math.floor(m/60),mm=Math.round(m%60);return h?`${h} h ${mm} min`:`${mm} min`;}
async function loadDayMetrics(day){
 let ids=P.map((p,i)=>p.day===day?i:null).filter(x=>x!==null);
 // Sort by longitude/latitude roughly along westward trip; for local points, sort by point id.
 ids.sort((a,b)=>a-b);
 let totalKm=0,totalMin=0, rows=[];
 for(let k=0;k<ids.length-1;k++){
   const a=P[ids[k]],b=P[ids[k+1]];
   const m=await routeMetric(a,b); if(m){totalKm+=m.km;totalMin+=m.min;rows.push(`${esc(a.name)} → ${esc(b.name)}: <b>${m.km.toFixed(0)} km</b>, ${fmtMin(m.min)}</b>`);}
 }
 let extra='';
 if(day===5) extra='✈️ Chicago → Yellowstone: lot; czas lotu zależy od połączenia.';
 document.getElementById('metrics').innerHTML=`<b>🚗 Dzień ${day}</b><br>${extra}<br>${rows.join('<br>')}<br><b>Razem lokalnie: ${totalKm.toFixed(0)} km / ${fmtMin(totalMin)}</b>`;
}
async function showRouteMetrics(){
 document.getElementById('metrics').innerHTML='<b>🚗 Główne odcinki</b><br><span class="status">Obliczam aktualne trasy drogowe…</span>';
 let total=0,mins=0,html='';
 for(const s of R){
   const a=pointById[s.from],b=pointById[s.to];
   if(a.name==='Chicago'){html+=`<div class="routeRow">✈️ <b>${esc(a.name)} → ${esc(b.name)}</b><br>Przelot — odległość lotnicza, bez czasu dojazdu na lotnisko.</div>`;continue;}
   const m=await routeMetric(a,b);
   if(m){total+=m.km;mins+=m.min;html+=`<div class="routeRow"><b>${esc(a.name)} → ${esc(b.name)}</b><br>📏 ${m.km.toFixed(0)} km &nbsp; ⏱️ ${fmtMin(m.min)}<br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lon}&destination=${b.lat},${b.lon}">Nawiguj w Google Maps ↗</a></div>`;}
 }
 document.getElementById('metrics').innerHTML=`<b>🚗 Główne odcinki</b>${html}<hr><b>Łącznie autem: około ${total.toFixed(0)} km / ${fmtMin(mins)}</b>`;
}
fitAll();
showRouteMetrics();
</script>
</body></html>
